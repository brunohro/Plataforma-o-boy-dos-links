
{% load static %}

<section class="banner-section">
    <div class="carousel">

        <div class="carousel-track">

            {% for banner in banners %}
            <div class="carousel-slide">

                {% if banner.link %}
                <a href="{{ banner.link }}">
                {% endif %}

                    <img
                        src="{{ banner.imagem.url }}"
                        alt="{{ banner.titulo }}"
                    >

                {% if banner.link %}
                </a>
                {% endif %}

            </div>
            {% empty %}
            <div class="carousel-slide">
                <img
                    src="{% static 'images/banner1.png' %}"
                    alt="Semana da Tecnologia"
                >
            </div>
            {% endfor %}

        </div>

        {% if banners|length > 1 %}

        <!-- Botões -->
        <button
            class="carousel-button prev"
            type="button"
            onclick="mudarSlide(-1)">
            ❮
        </button>

        <button
            class="carousel-button next"
            type="button"
            onclick="mudarSlide(1)">
            ❯
        </button>

        <!-- Indicadores -->
        <div class="carousel-indicators">

            {% for banner in banners %}
            <span
                class="indicator {% if forloop.first %}active{% endif %}"
                onclick="irParaSlide()">
            </span>
            {% endfor %}

        </div>

        {% endif %}

    </div>
</section>
