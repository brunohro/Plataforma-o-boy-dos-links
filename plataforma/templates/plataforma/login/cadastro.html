{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - O Boy Dos Links</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/cadastro.css' %}">
</head>
<body>
    <main class="cadastro-container">
        <div class="cadastro-area">

            <h1 class="cadastro-titulo">
                O Boy <span>Dos Links</span>
            </h1>

            <div class="cadastro-box">

                <h2 class="cadastro-subtitulo">
                    Criar Conta
                </h2>

                <p class="cadastro-descricao">
                    Crie sua conta e acesse para salvar<br>
                    seus links e aproveitar recursos.
                </p>

                <form class="cadastro-form">

                    <div class="cadastro-campo">

                        <label for="name">
                            Nome
                        </label>

                        <input
                            type="name"
                            id="name"
                            placeholder="ex.: Renan"
                        >

                    </div>

                    <div class="cadastro-campo">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="seu@email.com"
                        >

                    </div>

                    <div class="cadastro-campo cadastro-senha-area">

                        <div class="cadastro-senha-label">

                            <label for="senha">
                                Senha
                            </label>

                        </div>

                        <input
                            type="password"
                            id="senha"
                            placeholder="••••••"
                        >

                    </div>

                    <div class="cadastro-campo cadastro-senha-area">

                        <div class="cadastro-senha-label">

                            <label for="confirmar_senha">
                                Confirmar senha
                            </label>

                        </div>

                        <input
                            type="password"
                            id="senha"
                            placeholder="••••••"
                        >
                        
                    </div>

                    <button class="cadastro-botao" type="submit">
                        Cadastrar
                    </button>

                </form>

            </div>

            <p class="cadastro-cadastro">
                Já possui uma conta?
                <a href="{% url 'login' %}">Entrar</a>
            </p>

        </div>
    </main>
</body>
</html>
